<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — Legal</title>
  <meta name="description" content="Legal documents for apps by Hoa Nguyen.">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1f2933;
      --muted: #52606d;
      --accent: #0d9488;
      --rule: #e4e7eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --fg: #e2e8f0;
        --muted: #94a3b8;
        --accent: #14b8a6;
        --rule: #1e293b;
      }
    }
    body {
      margin: 0;
      padding: 3rem 1rem;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
      line-height: 1.65;
    }
    main { max-width: 680px; margin: 0 auto; }
    h1 { color: var(--accent); margin: 0 0 0.5rem; }
    p { color: var(--muted); }
    ul { padding-left: 1.4rem; }
    li { margin: 0.75rem 0; }
    a { color: var(--accent); }
    footer {
      margin-top: 3rem;
      padding-top: 1rem;
      border-top: 1px solid var(--rule);
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Projects — Legal</h1>
    <p>Legal documents for apps by Hoa Nguyen.</p>

    <h2>MyPing</h2>
    <ul>
      <li>
        <a href="my-ping/privacy-policy.html">MyPing Privacy Policy</a>
      </li>
    </ul>

    <footer>© 2026 Hoa Nguyen. All rights reserved.</footer>
  </main>
</body>
</html>
